name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:fast
      - run: pnpm exec eslint src/
      - run: pnpm exec tsgo --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec vitest run --coverage
      - run: node scripts/check-coverage-tiers.mjs
      - run: bash scripts/check-spec-refs.sh
      - run: pnpm exec vitest run tests/db/schema-consistency.test.ts
      - run: bash scripts/smoke-test.sh
